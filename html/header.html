<header class="site-header">
  <div class="nav-wrap">
    <a class="brand" href="../index.html" aria-label="Tatreez home">
      <img src="../images/logo-tatreez.png" alt="">
      <span>TATREEZ</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">Menu</button>
    <nav class="nav" id="site-navigation" aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="tatreez-history.html">The story</a>
      <a href="gallery.html">Gallery</a>
      <a href="thoubs.html">Thoubs</a>
      <a href="designer.html">Motif studio</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>
<style>
.site-header{position:sticky;top:0;z-index:30;background:#f4efe5ed;backdrop-filter:blur(14px);border-bottom:1px solid #25231f24}
.site-header .nav-wrap{max-width:1240px;min-height:78px;margin:auto;padding:0 6%;display:flex;align-items:center;justify-content:space-between}
.site-header .brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.site-header .brand img{width:48px;height:48px;object-fit:contain}
.site-header .brand span{font:600 16px 'Playfair Display',Georgia,serif;letter-spacing:.2em;color:#812f36}
.site-header .nav{display:flex;align-items:center;gap:24px}
.site-header .nav a{font:700 10px 'DM Sans',Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;text-decoration:none;color:#716b60}
.site-header .nav a:hover,.site-header .nav a[aria-current=page]{color:#812f36}
.site-header .menu-toggle{display:none;border:1px solid #25231f24;background:transparent;padding:10px 13px;color:#25231f;font:600 10px 'DM Sans',Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:800px){.site-header .nav-wrap{min-height:70px}.site-header .menu-toggle{display:block}.site-header .nav{display:none;position:absolute;top:70px;left:0;right:0;padding:22px 6%;background:#f4efe5;border-bottom:1px solid #25231f24;flex-direction:column;align-items:flex-start;gap:20px}.site-header .nav.is-open{display:flex}}
</style>
<script>
(()=>{const button=document.querySelector('.site-header .menu-toggle');const nav=document.querySelector('.site-header #site-navigation');if(!button||!nav)return;button.addEventListener('click',()=>{const open=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',String(!open));nav.classList.toggle('is-open',!open)});nav.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>{button.setAttribute('aria-expanded','false');nav.classList.remove('is-open')}));})();
</script>
