<header class="fixed w-full top-0 z-50 transition-all duration-300">
  <nav id="nav" x-data="{ open: false }" role="navigation"
    class="w-full glass-nav shadow-sm transition-all duration-300">
    <div class="container mx-auto px-6 py-4 flex flex-wrap items-center justify-between">
      <!-- Logo -->
      <div class="flex-shrink-0">
        <a href="../index.html" class="block group">
          <img src="../images/logo-tatreez.png" alt="TATREEZ Logo"
            class="h-12 w-auto sm:h-14 md:h-16 transition-transform duration-300 group-hover:scale-105" />
        </a>
      </div>

      <!-- Hamburger menu button -->
      <div class="md:hidden">
        <button @click="open = !open"
          class="text-tatreez-charcoal dark:text-tatreez-cream hover:text-tatreez-red focus:outline-none focus:ring-2 focus:ring-tatreez-red rounded-md p-2 transition-colors"
          aria-label="Open main menu">
          <div class="w-6 h-6 relative">
            <span aria-hidden="true"
              class="block absolute h-0.5 w-6 bg-current transform transition duration-500 ease-in-out"
              :class="{'rotate-45 top-3': open, 'top-1.5': !open }"></span>
            <span aria-hidden="true"
              class="block absolute h-0.5 w-6 bg-current transform transition duration-500 ease-in-out top-3"
              :class="{'opacity-0': open } "></span>
            <span aria-hidden="true"
              class="block absolute h-0.5 w-6 bg-current transform transition duration-500 ease-in-out"
              :class="{'-rotate-45 top-3': open, 'top-4.5': !open}"></span>
          </div>
        </button>
      </div>

      <!-- Navigation menu -->
      <div id="menu" :class="{'max-h-96 opacity-100': open, 'max-h-0 opacity-0 md:opacity-100 md:max-h-full': !open}"
        class="w-full md:w-auto md:flex md:items-center overflow-hidden transition-all duration-500 ease-in-out">
        <ul class="flex flex-col md:flex-row md:space-x-8 mt-4 md:mt-0 font-signika font-semibold text-lg">
          <li>
            <a href="../index.html"
              class="block py-2 md:py-0 text-tatreez-charcoal dark:text-tatreez-cream hover:text-tatreez-red transition-colors relative group">
              HOME
              <span
                class="absolute bottom-0 left-0 w-full h-0.5 bg-tatreez-red transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></span>
            </a>
          </li>
          <li>
            <a href="../html/gallery.html"
              class="block py-2 md:py-0 text-tatreez-charcoal dark:text-tatreez-cream hover:text-tatreez-red transition-colors relative group">
              GALLERY
              <span
                class="absolute bottom-0 left-0 w-full h-0.5 bg-tatreez-red transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></span>
            </a>
          </li>
          <li>
            <a href="../html/designer.html"
              class="block py-2 md:py-0 text-tatreez-charcoal dark:text-tatreez-cream hover:text-tatreez-red transition-colors relative group">
              DESIGNER
              <span
                class="absolute bottom-0 left-0 w-full h-0.5 bg-tatreez-red transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></span>
            </a>
          </li>
          <li>
            <a href="../html/about.html"
              class="block py-2 md:py-0 text-tatreez-charcoal dark:text-tatreez-cream hover:text-tatreez-red transition-colors relative group">
              ABOUT
              <span
                class="absolute bottom-0 left-0 w-full h-0.5 bg-tatreez-red transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></span>
            </a>
          </li>
          <li>
            <a href="../html/contact.html"
              class="block py-2 md:py-0 text-tatreez-charcoal dark:text-tatreez-cream hover:text-tatreez-red transition-colors relative group">
              CONTACT
              <span
                class="absolute bottom-0 left-0 w-full h-0.5 bg-tatreez-red transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
<div class="h-24 md:h-28"></div> <!-- Spacer for fixed header -->
